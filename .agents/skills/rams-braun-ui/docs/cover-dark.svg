<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="rams-braun-ui — a braun-era design system as an agent skill">
  <title>rams-braun-ui</title>
  <style>
